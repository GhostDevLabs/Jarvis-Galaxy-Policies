<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7f5" />
    <title>Jarvis Galaxy · Policies</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #19241f; background: #f5f7f5; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; }
      main { width: min(100%, 520px); padding: 38px; border: 1px solid #e5ebe6; border-radius: 16px; background: #fff; }
      h1 { margin: 0 0 10px; font-size: 28px; letter-spacing: -1px; }
      p { color: #68756e; font-size: 14px; line-height: 1.6; }
      nav { display: grid; gap: 10px; margin-top: 24px; }
      a { padding: 13px 15px; border: 1px solid #e5ebe6; border-radius: 8px; color: #287452; font-size: 14px; font-weight: 600; text-decoration: none; }
      a:hover { background: #f3f8f4; }
    </style>
  </head>
  <body>
    <main>
      <h1>Jarvis Galaxy</h1>
      <p>Legal information for the Jarvis Galaxy social analytics dashboard.</p>
      <nav aria-label="Legal policies">
        <a href="./terms.html">Terms of Service</a>
        <a href="./privacy.html">Privacy Policy</a>
      </nav>
    </main>
  </body>
</html>
